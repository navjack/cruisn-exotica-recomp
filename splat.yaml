name: Cruisnexotica (North America)
sha1: 428f53a060103fd88ebfbdcc032a99caea901e17

options:
  basename: cruisn_exotica
  target_path: ../../roms/Cruis'n Exotica (U) [!].z64
  elf_path: build/cruisn_exotica.elf
  base_path: .
  platform: n64
  compiler: KMC
  ld_script_path: build/cruisn_exotica.ld
  ld_dependencies: True
  find_file_boundaries: True
  header_encoding: ASCII
  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32
  symbol_addrs_path:
    - decomp/symbol_addrs.txt
  reloc_addrs_path:
    - decomp/reloc_addrs.txt
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: header
    type: header
    start: 0x0
  - name: ipl3
    type: bin
    start: 0x40
  - name: entry
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, hasm]
  - name: main
    type: code
    start: 0x1060
    vram: 0x80000460
    follows_vram: entry
    bss_size: 0x65070
    subsegments:
      - [0x1060, asm]
      - [0x4C270, data]
      - { type: bss, vram: 0x8005B8F0 }
  # func_800305A0 reads ROM 0x5C4F0-0x756E0 to 0x8032C000 and clears BSS to 0x803477B0.
  - name: overlay
    type: code
    start: 0x5C4F0
    vram: 0x8032C000
    subsegments:
      - [0x5C4F0, asm]
      - [0x74690, data]
  - type: bin
    start: 0x756E0
  - [0x1000000]
